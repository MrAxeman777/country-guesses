<!DOCTYPE html>
<html>
<head>
    <title>Country Guesses 🌍</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

        <h1>🌍 Country Guesses</h1>

    <script src="script.js"></script>
</body>
</html>
